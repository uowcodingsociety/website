<div class="partnerWidget{% if sponsor.sponsorImageName == 'citadel.png' %} partnerWidget-wide{% endif %}">
    <a href="{{ sponsor.sponsorSiteURL }}"><img class="partnerLogo" src="/static/assets/CompanyLogos/{{ sponsor.sponsorImageName}}"></a>
    <h3 class="partnerTitle">{{ sponsor.sponsorName }}</h3>
    <h4 class="partnerAttributes">{{ sponsor.sponsorIndustry }} <span>•</span> {{ sponsor.sponsorTier }}</h4>
    <a href="{{ sponsor.sponsorSiteURL }}"><button class="partnerButton">View Website</button></a>
    <p class="partnerDescription">{{ sponsor.sponsorDescription }}</p>
</div>
